<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <title>YouTube Live Web Transcriber (No Mic / Pure Web)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      overflow: hidden;
    }

    header {
      background: #131c2e;
      border: 1px solid #1e293b;
      padding: 10px 16px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: bold;
      color: #38bdf8;
    }

    .status-tag {
      font-size: 12px;
      color: #94a3b8;
      background: #0f172a;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }

    .input-bar {
      display: flex;
      gap: 8px;
      background: #131c2e;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }

    input[type="text"] {
      flex: 1;
      background: #0b0f19;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
    }

    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-stop { background: #dc2626; }
    .btn-stop:hover { background: #b91c1c; }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 12px;
      overflow: hidden;
    }

    .panel {
      background: #131c2e;
      border: 1px solid #1e293b;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-head {
      padding: 8px 12px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      font-size: 12px;
      font-weight: bold;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .transcript-view {
      flex: 1;
      background: #0b0f19;
      margin: 10px;
      border-radius: 4px;
      border: 1px solid #1e293b;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-line {
      font-size: 14px;
      line-height: 1.6;
      color: #e2e8f0;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 6px;
    }

    .log-time {
      color: #38bdf8;
      font-weight: 600;
      font-size: 11px;
      margin-right: 6px;
    }

    .empty-hint {
      color: #64748b;
      font-size: 13px;
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>⚡ YouTube ਲਾਈਵ ਡਿਜੀਟਲ ਟ੍ਰਾਂਸਕ੍ਰਾਈਬਰ (Web-Native)</span>
    </div>
    <span class="status-tag" id="statusState">ਸਥਿਤੀ: ਰੈਡੀ</span>
  </header>

  <div class="input-bar">
    <input type="text" id="ytUrl" placeholder="ਯੂਟਿਊਬ ਲਾਈਵ ਵੀਡੀਓ ਲਿੰਕ ਪਾਓ (e.g. https://www.youtube.com/watch?v=... ਜਾਂ https://youtu.be/...)">
    <button class="btn" id="streamBtn" onclick="toggleProcessing()">
      <span id="btnText">ਲਾਈਵ ਚਲਾਓ ਤੇ ਕੱਢੋ</span>
    </button>
  </div>

  <div class="workspace">
    
    <!-- ਵੀਡੀਓ ਪਲੇਅਰ -->
    <div class="panel">
      <div class="panel-head">
        <span>ਲਾਈਵ ਵੀਡੀਓ ਸਟ੍ਰੀਮ</span>
        <span id="liveBadge" style="color: #64748b;">ਕੋਈ ਸਟ੍ਰੀਮ ਨਹੀਂ</span>
      </div>
      <iframe id="videoPlayer" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <!-- ਨਾਲੋ-ਨਾਲ ਪੰਜਾਬੀ ਟੈਕਸਟ -->
    <div class="panel">
      <div class="panel-head">
        <span>ਲਾਈਵ ਪੰਜਾਬੀ ਲਿਖਤ (ਟਾਈਮਕੋਡ ਸਮੇਤ)</span>
        <div style="display: flex; gap: 6px;">
          <button class="btn" style="padding: 2px 8px; font-size: 11px; background: #334155;" onclick="copyAllText()">ਸਾਰਾ ਕਾਪੀ ਕਰੋ</button>
          <button class="btn" style="padding: 2px 8px; font-size: 11px; background: #334155;" onclick="clearBox()">ਸਾਫ਼ ਕਰੋ</button>
        </div>
      </div>
      <div class="transcript-view" id="transcriptContainer">
        <div class="empty-hint" id="hintBox">ਵੀਡੀਓ ਲਿੰਕ ਪਾ ਕੇ "ਲਾਈਵ ਚਲਾਓ ਤੇ ਕੱਢੋ" ਦਬਾਓ। ਇੱਥੇ ਡਿਜੀਟਲ ਸਟ੍ਰੀਮ ਤੋਂ ਪੰਜਾਬੀ ਟਾਈਪ ਹੁੰਦੀ ਰਹੇਗੀ।</div>
      </div>
    </div>

  </div>

<script>
  let isRunning = false;
  let pollInterval = null;
  let seenItems = new Set();

  function getVideoId(url) {
    const m = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
    return (m && m[2].length === 11) ? m[2] : null;
  }

  async function fetchLiveSubtitles(videoId) {
    try {
      // ਲਾਈਵ ਪਬਲਿਕ ਇਨਵੀਡੀਅਸ/ਯੂਟਿਊਬ ਕੈਪਸ਼ਨ ਐਂਡਪੁਆਇੰਟ
      const endpoint = `https://invidious.jing.rocks/api/v1/captions/${videoId}?lang=pa`;
      const res = await fetch(endpoint);
      if (!res.ok) return;
      const data = await res.text();

      // VTT/SRT ਲਾਈਨਾਂ ਪੜ੍ਹਨਾ
      const lines = data.split('\n');
      lines.forEach(line => {
        const clean = line.trim();
        if (clean && !clean.includes('-->') && !clean.match(/^\d+$/) && !clean.includes('WEBVTT')) {
          if (!seenItems.has(clean)) {
            seenItems.add(clean);
            appendLine(clean);
          }
        }
      });
    } catch (e) {
      // ਲਾਈਵ ਪੋਲਿੰਗ ਫਾਲਬੈਕ
    }
  }

  function appendLine(text) {
    const hint = document.getElementById('hintBox');
    if (hint) hint.remove();

    const container = document.getElementById('transcriptContainer');
    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    const lineElem = document.createElement('div');
    lineElem.className = 'log-line';
    lineElem.innerHTML = `<span class="log-time">[${timeStr}]</span> ${text}`;

    container.appendChild(lineElem);
    container.scrollTop = container.scrollHeight;
  }

  function toggleProcessing() {
    const url = document.getElementById('ytUrl').value.trim();
    const btn = document.getElementById('streamBtn');
    const status = document.getElementById('statusState');
    const badge = document.getElementById('liveBadge');

    if (!isRunning) {
      const vid = getVideoId(url);
      if (!vid) {
        alert("ਕਿਰਪਾ ਕਰਕੇ ਸਹੀ YouTube ਲਿੰਕ ਪਾਓ!");
        return;
      }

      // 1. ਯੂਟਿਊਬ ਪਲੇਅਰ ਚਲਾਓ (CC ਆਟੋ-ਆਨ ਨਾਲ)
      document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${vid}?autoplay=1&cc_load_policy=1&hl=pa`;

      isRunning = true;
      btn.className = "btn btn-stop";
      document.getElementById('btnText').innerText = "ਸਟ੍ਰੀਮ ਰੋਕੋ";
      status.innerText = "ਸਥਿਤੀ: ਲਾਈਵ ਫੈਚ ਹੋ ਰਿਹਾ ਹੈ";
      status.style.color = "#38bdf8";
      badge.innerText = "🔴 ਲਾਈਵ ਚੱਲ ਰਿਹਾ ਹੈ";
      badge.style.color = "#ef4444";

      // 2. ਰੀਅਲ-ਟਾਈਮ ਡਿਜੀਟਲ ਟੈਕਸਟ ਸਕੈਨ
      fetchLiveSubtitles(vid);
      pollInterval = setInterval(() => {
        fetchLiveSubtitles(vid);
      }, 5000);

    } else {
      isRunning = false;
      clearInterval(pollInterval);
      document.getElementById('videoPlayer').src = "";
      btn.className = "btn";
      document.getElementById('btnText').innerText = "ਲਾਈਵ ਚਲਾਓ ਤੇ ਕੱਢੋ";
      status.innerText = "ਸਥਿਤੀ: ਰੋਕਿਆ ਗਿਆ";
      status.style.color = "#94a3b8";
      badge.innerText = "ਕੋਈ ਸਟ੍ਰੀਮ ਨਹੀਂ";
      badge.style.color = "#64748b";
    }
  }

  function copyAllText() {
    const lines = document.querySelectorAll('.log-line');
    let text = "";
    lines.forEach(l => text += l.innerText + "\n");
    if (!text) { alert("ਕੋਈ ਟੈਕਸਟ ਮੌਜੂਦ ਨਹੀਂ ਹੈ!"); return; }
    navigator.clipboard.writeText(text).then(() => alert("ਪੂਰਾ ਪੰਜਾਬੀ ਟੈਕਸਟ ਕਾਪੀ ਹੋ ਗਿਆ!"));
  }

  function clearBox() {
    seenItems.clear();
    document.getElementById('transcriptContainer').innerHTML = '<div class="empty-hint" id="hintBox">ਟੈਕਸਟ ਸਾਫ਼ ਕੀਤਾ ਗਿਆ। ਨਵੀਂ ਲਿਖਤ ਇੱਥੇ ਦਿਖਾਈ ਦੇਵੇਗੀ...</div>';
  }
</script>
</body>
</html>
