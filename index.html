<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <title>Direct YouTube Punjabi Transcriber</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
      overflow: hidden;
    }

    header {
      background: #131c2e;
      padding: 10px 16px;
      border-radius: 6px;
      border: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 15px;
      font-weight: bold;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-bar {
      display: flex;
      gap: 10px;
      background: #131c2e;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }

    input[type="text"] {
      flex: 1;
      background: #0b0f19;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
    }

    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }

    .btn-live {
      background: #16a34a;
    }
    .btn-live.active {
      background: #dc2626;
    }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 12px;
      overflow: hidden;
    }

    .panel {
      background: #131c2e;
      border: 1px solid #1e293b;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 8px 12px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      font-size: 12px;
      font-weight: bold;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .transcript-box {
      flex: 1;
      background: #0b0f19;
      border: 1px solid #1e293b;
      margin: 10px;
      border-radius: 4px;
      padding: 12px;
      color: #f1f5f9;
      font-size: 15px;
      line-height: 1.7;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .interim {
      color: #38bdf8;
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>🎙️ YouTube 1-ਕਲਿੱਕ ਪੰਜਾਬੀ ਲਾਈਵ ਟ੍ਰਾਂਸਕ੍ਰਾਈਬਰ</span>
    </div>
    <span id="statusIndicator" style="font-size: 12px; color: #94a3b8;">ਸਥਿਤੀ: ਤਿਆਰ</span>
  </header>

  <div class="input-bar">
    <input type="text" id="ytUrl" placeholder="ਯੂਟਿਊਬ ਲਿੰਕ ਪਾਓ (e.g. https://www.youtube.com/watch?v=...)">
    <button class="btn btn-live" id="runBtn" onclick="toggleStart()">
      <span id="btnIcon">▶️</span> <span id="btnLabel">ਵੀਡੀਓ ਚਲਾਓ ਤੇ ਟਾਈਪ ਕਰੋ</span>
    </button>
  </div>

  <div class="workspace">
    
    <!-- ਪਲੇਅਰ -->
    <div class="panel">
      <div class="panel-header">
        <span>ਲਾਈਵ ਸਟ੍ਰੀਮ ਵੀਡੀਓ</span>
      </div>
      <iframe id="player" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <!-- ਪੰਜਾਬੀ ਟੈਕਸਟ -->
    <div class="panel">
      <div class="panel-header">
        <span>ਰੀਅਲ-ਟਾਈਮ ਪੰਜਾਬੀ ਟਾਈਪਿੰਗ</span>
        <div style="display: flex; gap: 6px;">
          <button class="btn" style="padding: 2px 8px; font-size: 11px; background: #334155;" onclick="copyText()">ਕਾਪੀ</button>
          <button class="btn" style="padding: 2px 8px; font-size: 11px; background: #334155;" onclick="clearText()">ਸਾਫ਼ ਕਰੋ</button>
        </div>
      </div>
      <div class="transcript-box" id="textBox">ਵੀਡੀਓ ਸ਼ੁਰੂ ਹੋਣ 'ਤੇ ਇੱਥੇ ਪੰਜਾਬੀ ਟਾਈਪ ਹੋਣਾ ਸ਼ੁਰੂ ਹੋ ਜਾਵੇਗਾ...</div>
    </div>

  </div>

<script>
  function getVideoId(url) {
    const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(reg);
    return (match && match[2].length === 11) ? match[2] : null;
  }

  let isRunning = false;
  let fullText = "";
  let recognition = null;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechAPI();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'pa-IN'; // Punjabi

    recognition.onresult = (e) => {
      let temp = "";
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        const words = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          fullText += `[${time}] ${words}\n`;
        } else {
          temp += words;
        }
      }
      const box = document.getElementById('textBox');
      box.innerHTML = `${fullText}<span class="interim">${temp}</span>`;
      box.scrollTop = box.scrollHeight;
    };

    recognition.onend = () => {
      if (isRunning) {
        try { recognition.start(); } catch(err) {}
      }
    };
  }

  function toggleStart() {
    const url = document.getElementById('ytUrl').value.trim();
    const id = getVideoId(url);

    if (!isRunning) {
      if (!id) {
        alert("ਕਿਰਪਾ ਕਰਕੇ ਪਹਿਲਾਂ ਸਹੀ YouTube URL ਪਾਓ!");
        return;
      }

      // 1. ਉਸੇ ਪੇਜ 'ਤੇ ਵੀਡੀਓ ਚਲਾਓ
      document.getElementById('player').src = `https://www.youtube.com/embed/${id}?autoplay=1&enablejsapi=1`;

      // 2. ਬਿਨਾਂ ਕਿਸੇ ਸਕ੍ਰੀਨ ਸ਼ੇਅਰ ਦੇ ਸਿੱਧੀ ਟ੍ਰਾਂਸਕ੍ਰਿਪਸ਼ਨ ਸ਼ੁਰੂ
      try {
        recognition.start();
        isRunning = true;
      } catch(e) {
        console.warn(e);
      }

      document.getElementById('runBtn').className = "btn btn-live active";
      document.getElementById('btnIcon').innerText = "⏹️";
      document.getElementById('btnLabel').innerText = "ਬੰਦ ਕਰੋ";
      document.getElementById('statusIndicator').innerText = "ਸਥਿਤੀ: ਲਾਈਵ ਚੱਲ ਰਿਹਾ ਹੈ";
      document.getElementById('statusIndicator').style.color = "#ef4444";

    } else {
      // ਬੰਦ ਕਰਨਾ
      isRunning = false;
      try { recognition.stop(); } catch(e) {}
      document.getElementById('player').src = "";
      document.getElementById('runBtn').className = "btn btn-live";
      document.getElementById('btnIcon').innerText = "▶️";
      document.getElementById('btnLabel').innerText = "ਵੀਡੀਓ ਚਲਾਓ ਤੇ ਟਾਈਪ ਕਰੋ";
      document.getElementById('statusIndicator').innerText = "ਸਥਿਤੀ: ਰੋਕਿਆ ਗਿਆ";
      document.getElementById('statusIndicator').style.color = "#94a3b8";
    }
  }

  function copyText() {
    navigator.clipboard.writeText(document.getElementById('textBox').innerText).then(() => {
      alert("ਟ੍ਰਾਂਸਕ੍ਰਿਪਟ ਕਾਪੀ ਹੋ ਗਈ!");
    });
  }

  function clearText() {
    fullText = "";
    document.getElementById('textBox').innerHTML = "";
  }
</script>
</body>
</html>
